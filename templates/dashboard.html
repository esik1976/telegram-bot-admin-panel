{% extends "base.html" %}

{% block content %}
  <section class="page-header">
    <p class="eyebrow">Dashboard</p>
    <h1>Telegram Bot Admin Panel</h1>
    <p>Базовая панель управления ботом: состояние, prompt, модель и подготовка к логам сообщений.</p>
  </section>

  <section class="status-grid" aria-label="Статус проекта">
    <article>
      <span>Users</span>
      <strong>{{ users_count }}</strong>
    </article>
    <article>
      <span>Messages</span>
      <strong>{{ messages_count }}</strong>
    </article>
    <article>
      <span>Errors</span>
      <strong>{{ errors_count }}</strong>
    </article>
  </section>
{% endblock %}
