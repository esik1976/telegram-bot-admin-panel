{% extends "base.html" %}

{% block content %}
  <section class="page-header">
    <p class="eyebrow">Settings</p>
    <h1>Model Settings</h1>
    <p>Активные настройки провайдера и модели, которые будет читать Telegram Bot Worker.</p>
  </section>

  {% if saved %}
    <p class="notice">Настройки сохранены.</p>
  {% endif %}

  <form method="post" action="/settings" class="panel-form settings-grid">
    <label for="provider">Provider</label>
    <input id="provider" name="provider" type="text" value="{{ settings.provider }}" required>

    <label for="model">Model</label>
    <input id="model" name="model" type="text" value="{{ settings.model }}" required>

    <label for="temperature">Temperature</label>
    <input id="temperature" name="temperature" type="number" min="0" max="2" step="0.1" value="{{ settings.temperature }}" required>

    <label for="max_tokens">Max tokens</label>
    <input id="max_tokens" name="max_tokens" type="number" min="1" max="8000" step="1" value="{{ settings.max_tokens }}" required>

    <button type="submit">Сохранить настройки</button>
  </form>
{% endblock %}
